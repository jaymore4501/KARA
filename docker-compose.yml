version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: kara-postgres
    environment:
      POSTGRES_USER: kara
      POSTGRES_PASSWORD: kara_password
      POSTGRES_DB: kara_db
    ports:
      - "5432:5432"
    volumes:
      - kara_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kara -d kara_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: kara-redis
    ports:
      - "6379:6379"
    volumes:
      - kara_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  kara_pgdata:
  kara_redis_data:
